# Local Postgres. There is no local psql on this machine, so the container is
# the only database. Data lives in a named volume so `down` does not wipe it;
# use `docker compose down -v` when you actually want a clean slate.
services:
  postgres:
    image: postgres:16-alpine
    container_name: unbound-merch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
